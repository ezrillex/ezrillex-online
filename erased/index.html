<!DOCTYPE html>

    <title>Desaparecida</title>
    <meta property="og:title" content="Erased">
    <meta property="og:type" content="video.tv_show">
    <meta property="og:description" content="Satoru Fujinuma trabaja como repartidor de pizzas para llegar a final de mes. Lo que no sabe nadie es que posee un don excepcional: cada vez que tiene lugar alguna tragedia cerca de él es proyectado unos minutos hacia atrás en el tiempo para tratar de impedirla. Precisamente uno de estos episodios hace aflorar los recuerdos reprimidos de su infancia traumática, lo que acaba teniendo consecuencias demoledoras y trágicas en su presente. Una vez más, sufre una de sus Regresiones, solo que esta vez lo lleva hasta el año 1988, justo antes de que su compañera de clase Kayo Hinazuki se convirtiera en la primera víctima de un asesino en serie. ¿Será el Satoru de 10 años capaz de reparar el pasado para cambiar el presente?">
